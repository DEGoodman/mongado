name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/static/assets/**'  # Ignore non-article assets
      - 'docs/**'  # Ignore documentation
      - 'README.md'  # Ignore root README
      # Note: We DO deploy on article changes to invalidate backend cache
  workflow_dispatch:  # Allow manual deployment

jobs:
  # Deploy to production (CI must pass first via branch protection or ci.yml trigger)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: Add DigitalOcean host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Create pre-deployment backup
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        # Runs the zero-downtime JSON export inside the currently-running backend
        # container over SSH (#267), so no admin token is needed - CI authenticates
        # to the droplet with its SSH key. On the first deploy of this change the
        # running container predates scripts/backup_export.py, so this is expected
        # to no-op; continue-on-error keeps that from blocking the deploy.
        run: |
          echo "📦 Creating pre-deployment backup..."
          ssh "$DO_USER@$DO_HOST" \
            "cd /opt/mongado && docker compose -f docker-compose.prod.yml exec -T backend python -m scripts.backup_export"
        continue-on-error: true

      - name: Deploy to DigitalOcean
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_MONGADO_SERVICE_ACCOUNT_TOKEN }}
          ADMIN_PASSKEY: ${{ secrets.ADMIN_PASSKEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          WEBAUTHN_RP_ID: ${{ secrets.WEBAUTHN_RP_ID }}
        run: |
          # Pass secrets to the droplet as SSH command arguments, base64-encoded.
          # ssh joins the args into one string that the remote LOGIN shell (zsh)
          # re-parses before `bash -s` runs, so a raw value containing a glob char
          # (* ? [ ] { }) makes zsh abort with "no matches found" (#267; hit live
          # in #268). base64's alphabet has no glob chars, so the encoded args
          # survive that re-parse; the heredoc decodes them under bash. This also
          # keeps the plaintext secrets out of the remote process list.
          ssh $DO_USER@$DO_HOST "bash -s" \
            "$(printf %s "$CORS_ORIGINS" | base64 -w0)" \
            "$(printf %s "$OP_SERVICE_ACCOUNT_TOKEN" | base64 -w0)" \
            "$(printf %s "$ADMIN_PASSKEY" | base64 -w0)" \
            "$(printf %s "$NEXT_PUBLIC_API_URL" | base64 -w0)" \
            "$(printf %s "$NEO4J_PASSWORD" | base64 -w0)" \
            "$(printf %s "$GROQ_API_KEY" | base64 -w0)" \
            "$(printf %s "$GEMINI_API_KEY" | base64 -w0)" \
            "$(printf %s "$SESSION_SECRET" | base64 -w0)" \
            "$(printf %s "$WEBAUTHN_RP_ID" | base64 -w0)" << 'EOF'
            set -e

            # Receive arguments (base64-decoded; see the encoding note above)
            CORS_ORIGINS="$(printf %s "$1" | base64 -d)"
            OP_SERVICE_ACCOUNT_TOKEN="$(printf %s "$2" | base64 -d)"
            ADMIN_PASSKEY="$(printf %s "$3" | base64 -d)"
            NEXT_PUBLIC_API_URL="$(printf %s "$4" | base64 -d)"
            NEO4J_PASSWORD="$(printf %s "$5" | base64 -d)"
            GROQ_API_KEY="$(printf %s "$6" | base64 -d)"
            GEMINI_API_KEY="$(printf %s "$7" | base64 -d)"
            SESSION_SECRET="$(printf %s "$8" | base64 -d)"
            WEBAUTHN_RP_ID="$(printf %s "$9" | base64 -d)"

            echo "📦 Deploying Mongado to production..."

            # Navigate to project directory
            cd /opt/mongado || { echo "Project directory not found"; exit 1; }

            # Pull latest changes
            echo "🔄 Pulling latest code from main branch..."
            git fetch origin
            git reset --hard origin/main

            # Tag this deployment for potential rollback
            DEPLOYMENT_TAG="deployment-$(date +%s)"
            echo "🏷️  Tagging deployment as: $DEPLOYMENT_TAG"
            git tag "$DEPLOYMENT_TAG" || echo "⚠️  Failed to create deployment tag (non-critical)"

            # Create/update environment files
            echo "🔐 Setting up environment variables..."

            # Backend .env file
            echo "DEBUG=false" > backend/.env
            echo "CORS_ORIGINS=$CORS_ORIGINS" >> backend/.env
            echo "OP_MONGADO_SERVICE_ACCOUNT_TOKEN=$OP_SERVICE_ACCOUNT_TOKEN" >> backend/.env
            echo "ADMIN_TOKEN=$ADMIN_PASSKEY" >> backend/.env
            # Passkey auth (#268): sign sessions with a secret independent of
            # ADMIN_TOKEN so a token leak cannot also forge sessions. Pin the
            # WebAuthn RP ID (mongado.com) so it can't drift with the
            # CORS_ORIGINS ordering and strand enrolled passkeys.
            echo "SESSION_SECRET=$SESSION_SECRET" >> backend/.env
            echo "WEBAUTHN_RP_ID=$WEBAUTHN_RP_ID" >> backend/.env
            # Hosted LLM API keys (#190): Groq = generation primary,
            # Gemini = generation fallback + embeddings
            echo "GROQ_API_KEY=$GROQ_API_KEY" >> backend/.env
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> backend/.env

            # Root .env file for docker-compose (so env vars persist across manual runs)
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" > .env
            echo "OP_MONGADO_SERVICE_ACCOUNT_TOKEN=$OP_SERVICE_ACCOUNT_TOKEN" >> .env
            echo "NEO4J_PASSWORD=$NEO4J_PASSWORD" >> .env
            echo "NEO4J_AUTH=neo4j/$NEO4J_PASSWORD" >> .env

            # Export environment variables for docker-compose (for this session)
            export NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL"
            export OP_MONGADO_SERVICE_ACCOUNT_TOKEN="$OP_SERVICE_ACCOUNT_TOKEN"
            export NEO4J_PASSWORD="$NEO4J_PASSWORD"
            export NEO4J_AUTH="neo4j/$NEO4J_PASSWORD"

            # Ensure the backup directory exists and is writable by the backend
            # container, which runs as uid 1000 (appuser). Root ownership breaks
            # POST /api/admin/backup with EACCES (#218). Root-run writers
            # (backup-cron, neo4j-admin dumps) are unaffected.
            echo "🗄️  Ensuring backup directory ownership..."
            mkdir -p /var/mongado-backups
            chown 1000:1000 /var/mongado-backups

            # Build and restart containers (without --no-cache to reduce resource usage)
            # --remove-orphans cleans up services deleted from the compose file
            # (e.g. the prod Ollama container removed in #190)
            echo "🐳 Building and restarting Docker containers..."
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for services to be healthy
            echo "⏳ Waiting for services to be healthy..."
            sleep 10

            # Restart backend to invalidate article cache
            # This ensures new/updated articles are picked up immediately
            echo "🔄 Restarting backend to invalidate article cache..."
            docker compose -f docker-compose.prod.yml restart backend

            # Wait for backend to fully restart before health check
            echo "⏳ Waiting for backend to fully restart..."
            sleep 15

            # Health check with retry logic
            echo "🏥 Running health checks..."
            RETRY_COUNT=0
            MAX_RETRIES=5
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f http://localhost:8000/ > /dev/null 2>&1; then
                echo "✅ Backend is healthy"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "⏳ Backend not ready yet, retrying in 5s... ($RETRY_COUNT/$MAX_RETRIES)"
                  sleep 5
                else
                  echo "❌ Backend health check failed after $MAX_RETRIES attempts"
                  docker compose -f docker-compose.prod.yml logs backend
                  exit 1
                fi
              fi
            done

            # Check frontend health with retry logic
            echo "🏥 Checking frontend health..."
            RETRY_COUNT=0
            MAX_RETRIES=5
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f http://localhost:3000/ > /dev/null 2>&1; then
                echo "✅ Frontend is healthy"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "⏳ Frontend not ready yet, retrying in 5s... ($RETRY_COUNT/$MAX_RETRIES)"
                  sleep 5
                else
                  echo "❌ Frontend health check failed after $MAX_RETRIES attempts"
                  docker compose -f docker-compose.prod.yml logs frontend
                  exit 1
                fi
              fi
            done

            # Clean up old images and build cache
            echo "🧹 Cleaning up old Docker images and build cache..."
            docker image prune -f
            docker builder prune -f

            echo "✅ Deployment complete!"
          EOF

      - name: Check database health
        run: |
          echo "🏥 Checking database health (single attempt - Cloudflare may block)..."

          # Single attempt - internal health checks already passed during deployment
          HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 10 https://api.mongado.com/api/admin/health/database)

          if [ "$HTTP_CODE" = "200" ] && jq -e . /tmp/health.json >/dev/null 2>&1; then
            HEALTH=$(cat /tmp/health.json)
            echo "$HEALTH" | jq '.'

            NEEDS_RESTORE=$(echo "$HEALTH" | jq -r '.needs_restore // false')
            if [ "$NEEDS_RESTORE" = "true" ]; then
              echo "⚠️ Database needs restore - triggering via SSH instead"
              # Note: External API restore may be blocked by Cloudflare
              # The auto-restore should be handled by internal health check or manually
            else
              echo "✅ Database is healthy ($(echo "$HEALTH" | jq -r '.notes_count // 0') notes)"
            fi
          else
            echo "⚠️ External health check blocked (HTTP $HTTP_CODE) - this is expected with Cloudflare"
            echo "Internal health checks already confirmed services are healthy"
          fi
        continue-on-error: true

      - name: Create post-deployment backup
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        # Snapshot the freshly-deployed state via the new backend container over
        # SSH (#267). No admin token, and no Cloudflare in the path (the old curl
        # to the public API was frequently blocked). Nightly cron backups still
        # run independently at 2 AM.
        run: |
          echo "💾 Creating post-deployment backup..."
          ssh "$DO_USER@$DO_HOST" \
            "cd /opt/mongado && docker compose -f docker-compose.prod.yml exec -T backend python -m scripts.backup_export"
        continue-on-error: true

      - name: Deployment notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi

      - name: Verify deployment
        run: |
          echo "🔍 Verifying production deployment (single attempt - Cloudflare may block)..."

          # Single attempt each - internal health checks already passed
          BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.mongado.com/ || echo "000")
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://mongado.com/ || echo "000")

          if [ "$BACKEND_STATUS" = "200" ]; then
            echo "✅ Backend API responding (Status: $BACKEND_STATUS)"
          else
            echo "⚠️ Backend external check blocked (Status: $BACKEND_STATUS)"
          fi

          if [ "$FRONTEND_STATUS" = "200" ]; then
            echo "✅ Frontend responding (Status: $FRONTEND_STATUS)"
          else
            echo "⚠️ Frontend external check blocked (Status: $FRONTEND_STATUS)"
          fi

          if [ "$BACKEND_STATUS" != "200" ] || [ "$FRONTEND_STATUS" != "200" ]; then
            echo ""
            echo "Note: External verification blocked by Cloudflare - this is expected"
            echo "Internal health checks (localhost) already confirmed services are healthy"
          fi

  # Rollback if deployment fails
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: Add DigitalOcean host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Rollback deployment
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh $DO_USER@$DO_HOST << 'EOF'
            set -e

            echo "⚠️  Deployment failed, attempting rollback..."

            cd /opt/mongado

            # Find the previous successful deployment tag
            # List all deployment tags, sort by timestamp, and get the second-to-last one
            PREV_TAG=$(git tag -l 'deployment-*' | sort -V | tail -2 | head -1)

            if [ -z "$PREV_TAG" ]; then
              echo "❌ No previous deployment tag found"
              echo "⚠️  Falling back to HEAD~1 (use with caution)"
              git reset --hard HEAD~1
            else
              echo "🔄 Rolling back to previous deployment: $PREV_TAG"
              git reset --hard "$PREV_TAG"

              # Verify the rollback target exists
              if ! git rev-parse --verify "$PREV_TAG" >/dev/null 2>&1; then
                echo "❌ Rollback tag $PREV_TAG does not exist"
                exit 1
              fi

              echo "✅ Rolled back to $PREV_TAG"
            fi

            # Restart containers with previous version
            echo "🐳 Restarting containers with previous version..."
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d

            # Wait for services to restart
            echo "⏳ Waiting for services to restart..."
            sleep 15

            # Verify rollback was successful
            echo "🏥 Verifying rollback..."
            if curl -f http://localhost:8000/ > /dev/null 2>&1; then
              echo "✅ Backend is healthy after rollback"
            else
              echo "⚠️  Backend health check failed after rollback"
            fi

            if curl -f http://localhost:3000/ > /dev/null 2>&1; then
              echo "✅ Frontend is healthy after rollback"
            else
              echo "⚠️  Frontend health check failed after rollback"
            fi

            echo "✅ Rollback complete"
          EOF
